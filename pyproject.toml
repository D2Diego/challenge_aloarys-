[project]
name = "rag-document-analyst"
version = "0.1.0"
description = "AI-powered document analyst using retrieval-augmented generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "torch>=2.4",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "rq>=2.0",
    "redis>=5.0",
    "pydantic-ai-slim[openai]>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Ollama instance — pytest -m integration",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
