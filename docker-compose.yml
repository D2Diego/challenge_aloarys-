x-backend-environment: &backend-environment
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
  REDIS_URL: redis://redis:6379
  OLLAMA_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  TOP_K_DEFAULT: ${TOP_K_DEFAULT:-5}
  MIN_SCORE: ${MIN_SCORE:-0.7}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:7b-instruct}"]
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *backend-environment
      SQLITE_DB_PATH: /data/conversations.db
      MAX_HISTORY_TURNS: ${MAX_HISTORY_TURNS:-5}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      UPLOAD_REQUEST_OVERHEAD_BYTES: ${UPLOAD_REQUEST_OVERHEAD_BYTES:-65536}
      DOCUMENT_UPLOAD_RATE_LIMIT: ${DOCUMENT_UPLOAD_RATE_LIMIT:-10}
      DOCUMENT_UPLOAD_RATE_WINDOW_SECONDS: ${DOCUMENT_UPLOAD_RATE_WINDOW_SECONDS:-60}
      INGESTION_JOB_TIMEOUT_SECONDS: ${INGESTION_JOB_TIMEOUT_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
    volumes:
      - hf_cache:/root/.cache/huggingface
      - conversations_db:/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "5173:5173"

volumes:
  qdrant_storage:
  ollama_data:
  hf_cache:
  conversations_db:
